name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  merge_group:
jobs:
  review:
    # The merge queue requires every required check on its merge group; a skipped job reports success.
    # A draft is reviewed once, when it becomes ready.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Pick the review depth
        id: depth
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # The list is optional: a repository without it gets the normal depth everywhere.
          list=$(gh api "repos/$REPO/contents/.github/deep-review-paths?ref=$BASE" --jq .content 2>/dev/null | base64 -d || true)
          paths=$(awk '!/^#/ && NF {sub(/^\//, "", $1); print $1}' <<<"$list")
          effort=high
          flag=""
          for f in $(gh pr diff "$PR" -R "$REPO" --name-only); do
            for p in $paths; do
              case "$f" in "$p"*) effort=xhigh; flag="--deep " ;; esac
            done
          done
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review --comment ${{ steps.depth.outputs.flag }}${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model claude-opus-5-5
            --effort ${{ steps.depth.outputs.effort }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"findings":{"type":"integer","minimum":0}},"required":["findings"]}'
      # The author's session can resolve a review thread it declines, so the thread rule alone does not hold a finding.
      - name: Fail while the review has findings
        env:
          OUTPUT: ${{ steps.review.outputs.structured_output }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # claude-code-action skips itself when this file differs from main; CODEOWNERS holds such a PR for the owner.
          if [ -z "$OUTPUT" ] && gh pr diff "$PR" -R "$REPO" --name-only | grep -qx '.github/workflows/review.yml'; then
            echo "::notice::Not reviewed: this pull request changes the review workflow."
            exit 0
          fi
          findings=$(jq -er .findings <<<"$OUTPUT")
          echo "Review: $findings finding(s)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$findings" -gt 0 ]; then
            echo "::error::The review found $findings issue(s). Push a fix: the next review judges it."
            exit 1
          fi
