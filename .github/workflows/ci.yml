name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun test
      - name: PR metrics
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --state all --limit 1000 --json number,title,state,author,mergedAt,reviews | bun src/cli.ts count)
          echo "Pull requests: $count" >> "$GITHUB_STEP_SUMMARY"
